# Include at nginx http scope. Set verified real_ip sources before enabling a CDN.
limit_req_zone $binary_remote_addr zone=flytoaspan_auth:10m rate=12r/m;
limit_req_zone $binary_remote_addr zone=flytoaspan_lookup:10m rate=35r/m;
limit_req_zone $binary_remote_addr zone=flytoaspan_public:10m rate=10r/s;
server {
    listen 80;
    server_name flytoaspan.com www.flytoaspan.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name flytoaspan.com www.flytoaspan.com;

    # Certbot / SSL certificates
    ssl_certificate     /etc/letsencrypt/live/flytoaspan.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flytoaspan.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Canonical client identity. Do not append any inbound forwarding headers.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header CF-Connecting-IP "";
    limit_req_status 429;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Immutable static bundle caching
    location /assets/ {
        proxy_pass http://127.0.0.1:3000;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ~ ^/api/(auth/(login|register|password-reset-request|2fa/.*)|booking-service/access)$ {
        limit_req zone=flytoaspan_auth burst=6 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }

    location ~ ^/api/(bookings/lookup(-cancel)?|booking-service/(list|requests))$ {
        limit_req zone=flytoaspan_lookup burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }

    location / {
        limit_req zone=flytoaspan_public burst=40 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }
}
