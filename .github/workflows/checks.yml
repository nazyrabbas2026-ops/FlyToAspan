name: FlyToAspan checks

on:
  pull_request:
  push:
    branches: [main, "codex/flytoaspan-preview"]

permissions:
  contents: read

jobs:
  verify:
    name: Build, API and security checks
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --no-audit
      - run: npm run build
      - run: npm run test:api
      - run: node --test tests/backup-production.mjs
      - run: npm audit --audit-level=moderate
